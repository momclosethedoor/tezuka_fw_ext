name: CI
on:
  workflow_dispatch:
    inputs:
      kit_run:
        description: 'Prior successful kernel kit run; empty rebuilds pinned stock kernel'
        required: false
        default: ''
permissions:
  contents: read
  actions: read
jobs:
  kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      BR2_EXTERNAL: ${{ github.workspace }}
      BR2_DL_DIR: /home/runner/br-dl
      OUTPUT_DIR: ${{ github.workspace }}/output/nano
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
      RUSTUP_TOOLCHAIN: '1.99.0'
    steps:
      - uses: actions/checkout@v6
      - name: Build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc g++ make bison flex bc libssl-dev libncurses-dev rsync cpio unzip wget curl device-tree-compiler u-boot-tools zstd kmod
          rustup toolchain install 1.99.0 --profile minimal
      - uses: actions/download-artifact@v8
        if: inputs.kit_run != ''
        with:
          name: obs-kernel-kit
          path: kit
          run-id: ${{ inputs.kit_run }}
          github-token: ${{ github.token }}
      - name: Restore explicit reusable kit
        if: inputs.kit_run != ''
        run: tar --zstd -xf kit/kernel-kit.tar.zst
      - uses: actions/cache/restore@v5
        if: inputs.kit_run == ''
        with:
          path: /home/runner/br-dl
          key: br-dl-${{ hashFiles('package/**/*.mk', 'package/**/*.hash', 'buildroot.version') }}
          restore-keys: br-dl-
      - uses: actions/cache/restore@v5
        if: inputs.kit_run == ''
        with:
          path: output/nano
          key: output-nano-${{ hashFiles('package/**/*.mk', 'package/**/*.hash', 'package/**/Config.in', 'Config.in', 'buildroot.version', 'patches/buildroot/**', 'board/tezuka/common/patches/**', 'board/tezuka/**/kernel/**', 'configs/nano_defconfig') }}
      - name: Pinned stock kernel build (no image or flash)
        if: inputs.kit_run == ''
        run: |
          set -euo pipefail
          ./getbuildroot.sh
          make -C buildroot O="$OUTPUT_DIR" nano_defconfig
          make -C buildroot O="$OUTPUT_DIR" olddefconfig
          make -C buildroot O="$OUTPUT_DIR" linux V=1 2>&1 | tee kernel-build.log
      - name: Export prepared kernel even if verification needs adjustment
        if: always()
        run: |
          set -euo pipefail
          KDIR="$OUTPUT_DIR/build/linux-custom"
          mkdir -p artifact kit-export
          cp "$KDIR/.config" artifact/kernel.config
          cp "$KDIR/Module.symvers" artifact/Module.symvers
          cp "$KDIR/include/generated/utsrelease.h" artifact/
          "$OUTPUT_DIR/host/bin/arm-linux-gcc" --version > artifact/compiler.txt
          tar -I 'zstd -T2 -3' -cf kit-export/kernel-kit.tar.zst output/nano/host output/nano/build/linux-custom
          sha256sum kit-export/kernel-kit.tar.zst > kit-export/SHA256SUMS
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: obs-kernel-kit
          path: kit-export/
      - name: Verify exact running-kernel ABI before building module
        run: |
          set -euo pipefail
          python3 tools/obs-dma/check_kernel.py "$OUTPUT_DIR/build/linux-custom" | tee artifact/kernel-check.txt
      - name: Build reusable DMA owner module
        run: |
          set -euo pipefail
          make -C "$OUTPUT_DIR/build/linux-custom" M="$PWD/tools/obs-dma" ARCH=arm CROSS_COMPILE="$OUTPUT_DIR/host/bin/arm-linux-" modules
          cp tools/obs-dma/obs_dma.ko artifact/
          modinfo artifact/obs_dma.ko | tee artifact/modinfo.txt
          cp tools/obs-dma/obs_dma.c tools/obs-dma/Makefile tools/obs-dma/check_kernel.py artifact/
          (cd artifact && sha256sum obs_dma.ko kernel.config Module.symvers > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: obs-dma-module
          path: artifact/
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: obs-kernel-build-log
          path: kernel-build.log
